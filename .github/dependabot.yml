# Keeps npm dependencies and GitHub Actions up to date.
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    labels:
      - "deps:locked"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk patch + minor updates so the maintainer reviews one PR
      # per week instead of one per package.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Singapore"
    commit-message:
      prefix: "chore(actions)"
