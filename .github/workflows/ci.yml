name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Each smoke script spawns its own Vite dev server on a free port,
      # drives a real Chromium against it, and tears the server down. Allow
      # extra time on the slowest job (smoke covers tutorial + first
      # purchase + scenario flow).
      - name: Smoke (tutorial + first purchase)
        run: npm run test:smoke
        timeout-minutes: 5

      - name: Smoke (buyer profiles)
        run: npm run test:profiles
        timeout-minutes: 5

      - name: Smoke (scroll reset)
        run: npm run test:scroll
        timeout-minutes: 3
